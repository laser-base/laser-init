# geodata-services.yaml — PVCs + Deployments + LoadBalancer Services
#
# Deploys all 5 geodata microservices into the laser-ai namespace.
#
# Deploy:
#   kubectl apply -f AKS/geodata-services.yaml --kubeconfig AKS/kube.conf
#
# Push images first:
#   make push-all-geodata TAG=v0.5.1a    (from services/ directory)

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laser-unwpp-cache
  namespace: laser-ai
  labels:
    app.kubernetes.io/part-of: laser-geodata
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laser-gadm-cache
  namespace: laser-ai
  labels:
    app.kubernetes.io/part-of: laser-geodata
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laser-geoboundaries-cache
  namespace: laser-ai
  labels:
    app.kubernetes.io/part-of: laser-geodata
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laser-unocha-cache
  namespace: laser-ai
  labels:
    app.kubernetes.io/part-of: laser-geodata
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laser-worldpop-cache
  namespace: laser-ai
  labels:
    app.kubernetes.io/part-of: laser-geodata
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 100Gi

# ── unwpp-service ─────────────────────────────────────────────────────────────

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laser-unwpp-svc
  namespace: laser-ai
  labels:
    app.kubernetes.io/part-of: laser-geodata
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: laser-unwpp-svc
  template:
    metadata:
      labels:
        app: laser-unwpp-svc
        app.kubernetes.io/part-of: laser-geodata
    spec:
      imagePullSecrets:
        - name: artifactory-login
      containers:
        - name: laser-unwpp-svc
          image: idm-docker-staging.packages.idmod.org/laser-unwpp-service:v0.5.1a
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: CACHE_DIR
              value: /cache
          resources:
            requests:
              cpu: "500m"
              memory: "3Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
          volumeMounts:
            - name: cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: laser-unwpp-cache
---
apiVersion: v1
kind: Service
metadata:
  name: laser-unwpp-svc
  namespace: laser-ai
  labels:
    app.kubernetes.io/part-of: laser-geodata
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app: laser-unwpp-svc

