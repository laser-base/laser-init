[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laser"]

[tool.uv]
package = true

[project]
name = "laser-init"
version = "0.1.0"
description = "A tool to bootstrap spatial epidemiological modeling with LASER by preparing geospatial, population, and demographic data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Lorton", email="christopher.lorton@gatesfoundation.org" },
]
keywords = [
    "epidemiology",
    "spatial modeling",
    "geospatial",
    "LASER",
    "disease modeling",
    "demographics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "anthropic>=0.84.0",
    "click>=8.3.1",
    "geopandas>=1.1.2",
    "laser-generic>=1.0.1",
    "matplotlib>=3.10.8",
    "openai>=2.24.0",
    "pandas>=2.3.3",
    "pycountry>=26.2.16",
    "pyogrio>=0.12.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "rastertoolkit>=0.4.9",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-include-markdown-plugin>=7.2.1",
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=1.0.3",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.5",
]

[project.urls]
Homepage = "https://laser-base.github.io/laser-init"
Documentation = "https://laser-base.github.io/laser-init"
Repository = "https://github.com/laser-base/laser-init"
Changelog = "https://github.com/laser-base/laser-init/blob/main/CHANGELOG.md"

[project.scripts]
laser-init = "laser.init.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
# E501 (line-too-long) is intentionally not enforced: `ruff format` owns line
# wrapping and deliberately leaves long URLs and log/message strings intact.
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=laser.init --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests as requiring network access",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["laser.init"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "**/anthropic_query.py",
    "**/openai_query.py",
    "**/models/plot.py",
    "**/models/si.py",
    "**/models/sir.py",
    "**/models/seir.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
