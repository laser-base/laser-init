[pytest]
# Pytest configuration for laser-init test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=laser.init
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Current coverage is ~86%. This gate is set just below that to guard against
    # regression; ratchet it back up toward 90% as test coverage improves
    # (notably cli.py, the loaders, and the GADM/geoBoundaries transformer paths).
    --cov-fail-under=85

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    slow: Tests that take longer to run
    network: Tests that require network access (should be mocked)
    extractor: Tests for data extractors
    transformer: Tests for data transformers
    model: Tests for epidemic models
    cli: Tests for CLI interface
    edge_case: Tests for edge cases and boundary conditions
    error: Tests for error handling

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = laser.init
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    **/anthropic_query.py
    **/openai_query.py
    **/models/plot.py
    **/models/si.py
    **/models/sir.py
    **/models/seir.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
