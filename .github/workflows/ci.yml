name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, and examples (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --python 3.12

      - name: Ruff lint
        run: uv run --python 3.12 ruff check src tests examples

      - name: Ruff format check
        run: uv run --python 3.12 ruff format --check src tests examples

      - name: Validate example scripts and notebooks
        # Static checks only — the examples download data and run full models, which
        # is too heavy/network-dependent for CI. We syntax-check every example script
        # and confirm the notebooks are valid nbformat-v4 JSON (so GitHub renders them).
        run: |
          uv run --python 3.12 python - <<'PY'
          import glob
          import json
          import py_compile

          for script in sorted(glob.glob("examples/**/*.py", recursive=True)):
              py_compile.compile(script, doraise=True)

          for nb in sorted(glob.glob("examples/notebooks/*.ipynb")):
              doc = json.load(open(nb))
              assert doc.get("nbformat") == 4 and isinstance(doc.get("cells"), list), nb

          print("examples: scripts compile and notebooks are valid")
          PY

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The test suite includes integration tests that download data from external
    # services (GitHub, WorldPop, UN WPP); allow ample time and run versions
    # independently so one failure does not cancel the other.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest
